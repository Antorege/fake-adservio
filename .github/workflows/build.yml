name: Build

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup project
        run: |
          SPEC=$(find . -name "project.yml" | head -1)
          DIR=$(dirname $SPEC)
          ICON=$(find . -name "icon.png" | head -1)
          mkdir -p "$DIR/Sources/Assets.xcassets/AppIcon.appiconset"
          cp "$ICON" "$DIR/Sources/Assets.xcassets/AppIcon.appiconset/icon.png"
          sips -z 1024 1024 "$DIR/Sources/Assets.xcassets/AppIcon.appiconset/icon.png"
          printf '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$DIR/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json"
          printf '{"info":{"author":"xcode","version":1}}' > "$DIR/Sources/Assets.xcassets/Contents.json"
          echo "settings:" >> "$SPEC"
          echo "  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon" >> "$SPEC"

      - name: Generate Xcode project
        run: |
          SPEC=$(find . -name "project.yml" | head -1)
          cd "$(dirname $SPEC)"
          xcodegen generate

      - name: Build archive
        run: |
          SPEC=$(find . -name "project.yml" | head -1)
          cd "$(dirname $SPEC)"
          xcodebuild archive \
            -project FakeAdservio.xcodeproj \
            -scheme FakeAdservio \
            -destination "generic/platform=iOS" \
            -archivePath FakeAdservio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          SPEC=$(find . -name "project.yml" | head -1)
          cd "$(dirname $SPEC)"
          mkdir -p Payload
          cp -r FakeAdservio.xcarchive/Products/Applications/FakeAdservio.app Payload/
          zip -r FakeAdservio.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FakeAdservio
          path: "**/FakeAdservio.ipa"
