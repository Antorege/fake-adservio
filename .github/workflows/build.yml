name: Build

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd fake-adservio
          xcodegen generate

      - name: Build archive
        run: |
          cd fake-adservio
          xcodebuild archive \
            -project FakeAdservio.xcodeproj \
            -scheme FakeAdservio \
            -destination "generic/platform=iOS" \
            -archivePath FakeAdservio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd fake-adservio
          mkdir -p Payload
          cp -r FakeAdservio.xcarchive/Products/Applications/FakeAdservio.app Payload/
          zip -r FakeAdservio.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FakeAdservio
          path: fake-adservio/FakeAdservio.ipa
